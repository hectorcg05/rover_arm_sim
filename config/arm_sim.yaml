# =====================================================================================================
# rover_arm_sim: ÚNICO archivo de parámetros físicos y de comportamiento de la simulación del brazo
# =====================================================================================================
# Cómo leer los comentarios (rutas relativas a ~/ros2_ws/src/):
#   archivo:línea   → valor copiado del código real del rover (VERIFICADO). La prueba
#                     test/test_sources.py compara cada copia contra el archivo original.
#   # PENDIENTE P1 / P3 / P4 → se mide en el brazo real (docs/contexto/GUIA_PENDIENTES.md).
#   # DEFAULT       → valor por defecto que no se va a medir (supuesto documentado en
#                     docs/sim_implementation/documentacion_sim.md).
#   "reporte §X"    → docs/sim_implementation/REPORTE_SIMULACION_BRAZO.md
# Para cambiar el comportamiento basta con editar este archivo y relanzar: no hay números físicos
# en el código.
# =====================================================================================================

# -----------------------------------------------------------------------------------------------------
# Arranque
# -----------------------------------------------------------------------------------------------------
startup:
  # Postura física del brazo al arrancar Gazebo (convención de arm_manager, grados).
  # P2 resuelto: GUIA_PENDIENTES.md:63-73 y docs/contexto/brazo_init.jpeg
  pose_deg:
    joint1: 0.0
    joint2: 170.0
    joint3: -146.0
    joint4: 0.0
    joint5: 0.0
  gripper_opening_m: 0.17          # DEFAULT (arranca abierto del todo)
  feedback_wait_timeout_s: 120.0   # DEFAULT tiempo máximo que el launch espera el primer feedback

# -----------------------------------------------------------------------------------------------------
# Emulador de drivers (nodo puente con Gazebo)
# -----------------------------------------------------------------------------------------------------
emulator:
  rate_hz: 100.0                   # DEFAULT (reporte §6.7, "Frecuencia de salida del emulador")
  status_rate_hz: 5.0              # DEFAULT
  status_topic: /rover_arm_sim/status
  reset_service: /rover_arm_sim/reset_driver
  joint_states_topic: /joint_states
  position_command_topic: /arm_position_controller/commands
  effort_command_topic: /arm_effort_controller/commands
  grasp_command_topic: /rover_arm_sim/grasp/command   # puente ROS <-> Gazebo (plugin GraspWeld)
  grasp_state_topic: /rover_arm_sim/grasp/state

# Un nodo ROS por driver real, con el mismo nombre que en el rover, para que los mensajes de log
# salgan igual ("[WARN] [arm_drive_ctre]: J1 angle ...").
driver_nodes:
  arm_drive_ctre:                  # bus_can_drive2/launch/drive_can2-launch.py:23
    kind: talon_group
    can_id_arm1: 7                 # bus_can_drive2/config/drive_can_tank_params.yaml:7
    can_id_arm5: 15                # bus_can_drive2/config/drive_can_tank_params.yaml:8
    can_id_gripper: 14             # bus_can_drive2/config/drive_can_tank_params.yaml:9
    can_id_lineal: 11              # bus_can_drive2/config/drive_can_tank_params.yaml:10
    feedback_rate_hz: 20.0         # bus_can_drive2/src/drive_can_tank.cpp:321-323 (50 ms)
    # Cada mensaje en estos topics renueva la habilitación de TODOS los Talon por 10 s
    # (FeedEnable(10000): drive_can_tank.cpp:375,389,400,409); /cmd_vel la renueva por 5 s (:355).
    enable_timeout_s: 10.0         # bus_can_drive2/src/drive_can_tank.cpp:375
    enable_topics: [/arm_teleop/joint1, /arm_teleop/joint4, /arm_teleop/gripper, /arm_teleop/elevador]
    cmd_vel_topic: /cmd_vel        # bus_can_drive2/src/drive_can_tank.cpp:276
    cmd_vel_enable_timeout_s: 5.0  # bus_can_drive2/src/drive_can_tank.cpp:355
    neutral_behavior: hold         # DEFAULT al deshabilitarse (brake/coast no se mide, reporte §6.3)
  dual_epos_node:                  # epos_control/launch/epos_control_launch.py:7
    kind: epos_group
    can_channel: can0              # epos_control/launch/epos_control_launch.py:13
    feedback_rate_hz: 20.0         # epos_control/epos_control/joint_control.py:135
    fault_check_rate_hz: 1.0       # epos_control/epos_control/joint_control.py:137
  arm_j5_servo:                    # DEFAULT: el controlador real de J5 no está en el repo (reporte N1)
    kind: plain
  arm_gripper_controller:          # DEFAULT: controlador externo, probablemente ESP32 (reporte N2)
    kind: plain

# -----------------------------------------------------------------------------------------------------
# Joints. driver_model elige el modelo de driver de cada joint (reporte §E.13):
#   talon_motion_magic | epos_ppm | servo | torque (el de epos4_drive, para cuando se migre)
# Cambiar de modelo = cambiar driver_model y llenar su bloque. No hay que tocar código.
# Bloque `physical` (reporte §3.1, capa física): grados físicos = scale · grados del driver + offset_deg.
# Bloque `gazebo`: ángulo URDF = urdf_sign · grados físicos + urdf_offset_deg (reporte §4.1). Los
# límites del joint en Gazebo salen de los límites del driver (K6), no del CAD.
# -----------------------------------------------------------------------------------------------------
joints:
  joint1:                                   # base (yaw)
    driver_node: arm_drive_ctre
    driver_model: talon_motion_magic        # hoy: drive_can_tank (reporte §E.13)
    command_topic: /arm_teleop/joint1       # bus_can_drive2/src/drive_can_tank.cpp:280
    sync_velocity_topic: /arm_sync/joint1_velocity   # bus_can_drive2/src/drive_can_tank.cpp:288
    feedback_deg_topic: /arm_feedback/joint1_deg     # bus_can_drive2/src/drive_can_tank.cpp:311
    feedback_raw_topic: /arm_feedback/joint1_ticks   # bus_can_drive2/src/drive_can_tank.cpp:316
    log_name: J1                            # bus_can_drive2/src/drive_can_tank.cpp:371
    talon_motion_magic:
      deg_min: -85.0                        # bus_can_drive2/config/drive_can_tank_params.yaml:21
      deg_max: 90.0                         # bus_can_drive2/config/drive_can_tank_params.yaml:22
      ticks_min: 1862.0                     # bus_can_drive2/config/drive_can_tank_params.yaml:23
      ticks_max: -186.0                     # bus_can_drive2/config/drive_can_tank_params.yaml:24
      invert: false                         # bus_can_drive2/src/drive_can_tank.cpp:94,377 (sin signo)
      phys_error: 0.0                       # bus_can_drive2/src/drive_can_tank.cpp:86
      add_phys_error: true                  # bus_can_drive2/src/drive_can_tank.cpp:369
      cruise_velocity: 25                   # ticks/100 ms, bus_can_drive2/src/drive_can_tank.cpp:122
      acceleration: 35                      # ticks/100 ms/s, bus_can_drive2/src/drive_can_tank.cpp:123
      sync_velocity_min: 1.0                # bus_can_drive2/src/drive_can_tank.cpp:334
      sync_velocity_max: 9.0                # bus_can_drive2/src/drive_can_tank.cpp:334
      stall_warning_deg: 2.0                # DEFAULT aviso "atascado" de la ventana (C21); el real no avisa
      stall_warning_time_s: 1.0             # DEFAULT (reporte §6.6, "Aviso de atasco > 1 s")
    physical:
      scale: 1.0                            # DEFAULT (calibración perfecta, reporte §6.3)
      offset_deg: 0.0                       # DEFAULT
    gazebo:
      urdf_joint: Joint_1
      urdf_sign: -1.0                       # θ1 = −q1 (reporte §4.1)
      urdf_offset_deg: 0.0                  # reporte §4.1
      limit_margin_deg: 0.0                 # DEFAULT: el Talon no tiene límite propio (ConfigFactoryDefault)
      effort: 150.0                         # DEFAULT N·m, par máximo del joint en Gazebo
      velocity: 3.0                         # DEFAULT rad/s, tope de Gazebo (los perfiles mandan)

  joint2:                                   # hombro (pitch)
    driver_node: dual_epos_node
    driver_model: epos_ppm                  # hoy: dual_epos_node (reporte §E.13)
    command_topic: /arm_teleop/joint2       # epos_control/launch/epos_control_launch.py:26
    sync_velocity_topic: /arm_sync/joint2_velocity   # epos_control/epos_control/joint_control.py:122
    feedback_deg_topic: /arm_feedback/joint2_deg     # epos_control/epos_control/joint_control.py:129
    feedback_raw_topic: /arm_feedback/joint2_counts  # epos_control/epos_control/joint_control.py:131
    log_name: Joint2                        # epos_control/epos_control/joint_control.py:102
    epos_ppm:
      node_id: 5                            # epos_control/launch/epos_control_launch.py:17
      angle_min: -5.0                       # epos_control/launch/epos_control_launch.py:18
      angle_max: 170.0                      # epos_control/launch/epos_control_launch.py:19
      counts_min: -28800.0                  # epos_control/launch/epos_control_launch.py:20
      counts_max: 979200.0                  # epos_control/launch/epos_control_launch.py:21
      profile_velocity: 350                 # epos_control/launch/epos_control_launch.py:22
      profile_acceleration: 1000            # epos_control/launch/epos_control_launch.py:23
      profile_deceleration: 1000            # epos_control/launch/epos_control_launch.py:24
      # EXCEPCIÓN DELIBERADA: el código dice 0.0 (epos_control/launch/epos_control_launch.py:25), pero
      # el brazo real arranca en 170° (P2). Ver hallazgo 13 de GUIA_PENDIENTES.md y reporte §E.12.
      initial_angle: 170.0
      max_velocity_factor: 2                # epos_control/epos_control/joint_control.py:185
      max_acceleration_factor: 2            # epos_control/epos_control/joint_control.py:186
      drive_limit_margin_counts: 1000       # epos_control/epos_control/joint_control.py:187-188
      sync_velocity_min: 1                  # epos_control/epos_control/joint_control.py:214
      # Velocidad física con los valores de perfil de arriba (la unidad del perfil no se sabe, §3.2)
      speed_deg_s: 16.6                     # PENDIENTE P3
      accel_deg_s2: 47.4                    # DEFAULT (reporte §6.5)
      setpoint_mode: immediate              # PENDIENTE P3 (immediate = continuo | buffered = a tirones)
      command_latency_ms: 20.0              # DEFAULT (reporte §6.5)
      following_error_window_counts: 2000   # DEFAULT de fábrica, epos_control/eds_files/flat90.eds:5004-5009
      sim_tracking_window_s: 0.08           # DEFAULT compensa el retraso propio de Gazebo (no existe en el real)
      fault_code: 0x8611                    # epos_control/epos_lib/epos_controller.py:50
      fault_error_register_bits: [0, 7]     # DEFAULT supuesto: genérico + "Motion error" (epos_controller.py:61-69)
      fault_behavior: hold                  # DEFAULT (reporte §6.5: "se sostiene")
    physical:
      scale: 1.0                            # DEFAULT
      offset_deg: 0.0                       # DEFAULT
    gazebo:
      urdf_joint: Joint_2
      urdf_sign: -1.0                       # θ2 = 90° − q2 (reporte §4.1)
      urdf_offset_deg: 90.0                 # reporte §4.1
      limit_margin_deg: 0.0                 # el margen lo da drive_limit_margin_counts
      effort: 300.0                         # DEFAULT N·m (alcanza para 5 kg con el brazo estirado)
      velocity: 3.0                         # DEFAULT rad/s

  joint3:                                   # codo (pitch)
    driver_node: dual_epos_node
    driver_model: epos_ppm
    command_topic: /arm_teleop/joint3       # epos_control/launch/epos_control_launch.py:39
    sync_velocity_topic: /arm_sync/joint3_velocity   # epos_control/epos_control/joint_control.py:123
    feedback_deg_topic: /arm_feedback/joint3_deg     # epos_control/epos_control/joint_control.py:130
    feedback_raw_topic: /arm_feedback/joint3_counts  # epos_control/epos_control/joint_control.py:132
    log_name: Joint3                        # epos_control/epos_control/joint_control.py:103
    epos_ppm:
      node_id: 4                            # epos_control/launch/epos_control_launch.py:30
      angle_min: -160.0                     # epos_control/launch/epos_control_launch.py:31
      angle_max: 170.0                      # epos_control/launch/epos_control_launch.py:32
      counts_min: -728178.0                 # epos_control/launch/epos_control_launch.py:33
      counts_max: 773689.0                  # epos_control/launch/epos_control_launch.py:34
      profile_velocity: 500                 # epos_control/launch/epos_control_launch.py:35
      profile_acceleration: 1000            # epos_control/launch/epos_control_launch.py:36
      profile_deceleration: 1000            # epos_control/launch/epos_control_launch.py:37
      initial_angle: -146.0                 # epos_control/launch/epos_control_launch.py:38
      max_velocity_factor: 2                # epos_control/epos_control/joint_control.py:185
      max_acceleration_factor: 2            # epos_control/epos_control/joint_control.py:186
      drive_limit_margin_counts: 1000       # epos_control/epos_control/joint_control.py:187-188
      sync_velocity_min: 1                  # epos_control/epos_control/joint_control.py:217
      speed_deg_s: 30.0                     # PENDIENTE P3
      accel_deg_s2: 60.0                    # DEFAULT (reporte §6.5)
      setpoint_mode: immediate              # PENDIENTE P3
      command_latency_ms: 20.0              # DEFAULT (reporte §6.5)
      following_error_window_counts: 2000   # DEFAULT de fábrica, epos_control/eds_files/joint3.eds:5004-5009
      sim_tracking_window_s: 0.08           # DEFAULT
      fault_code: 0x8611                    # epos_control/epos_lib/epos_controller.py:50
      fault_error_register_bits: [0, 7]     # DEFAULT supuesto
      fault_behavior: hold                  # DEFAULT
    physical:
      scale: 1.0                            # DEFAULT
      offset_deg: 0.0                       # DEFAULT
    gazebo:
      urdf_joint: Joint_3
      urdf_sign: -1.0                       # θ3 = −2.133° − q3 (reporte §4.1)
      urdf_offset_deg: -2.133               # reporte §4.1 (J3→J4 desfasado 0.016 m, brazo.urdf:113)
      limit_margin_deg: 0.0
      effort: 200.0                         # DEFAULT N·m
      velocity: 3.0                         # DEFAULT rad/s

  joint4:                                   # muñeca (pitch)
    driver_node: arm_drive_ctre
    driver_model: talon_motion_magic
    command_topic: /arm_teleop/joint4       # bus_can_drive2/src/drive_can_tank.cpp:284
    sync_velocity_topic: /arm_sync/joint4_velocity   # bus_can_drive2/src/drive_can_tank.cpp:292
    feedback_deg_topic: /arm_feedback/joint4_deg     # bus_can_drive2/src/drive_can_tank.cpp:313
    feedback_raw_topic: /arm_feedback/joint4_ticks   # bus_can_drive2/src/drive_can_tank.cpp:318
    log_name: J4                            # bus_can_drive2/src/drive_can_tank.cpp:385
    talon_motion_magic:
      deg_min: -150.0                       # bus_can_drive2/config/drive_can_tank_params.yaml:31
      deg_max: 150.0                        # bus_can_drive2/config/drive_can_tank_params.yaml:32
      ticks_min: -2206.0                    # bus_can_drive2/config/drive_can_tank_params.yaml:33
      ticks_max: -5617.0                    # bus_can_drive2/config/drive_can_tank_params.yaml:34
      invert: true                          # bus_can_drive2/src/drive_can_tank.cpp:99,391 (my_map(-ángulo))
      phys_error: 0.0                       # bus_can_drive2/src/drive_can_tank.cpp:86
      add_phys_error: false                 # bus_can_drive2/src/drive_can_tank.cpp:383 (J4 no lo suma)
      cruise_velocity: 30                   # bus_can_drive2/src/drive_can_tank.cpp:140
      acceleration: 40                      # bus_can_drive2/src/drive_can_tank.cpp:141
      sync_velocity_min: 3.0                # bus_can_drive2/src/drive_can_tank.cpp:340
      sync_velocity_max: 30.0               # bus_can_drive2/src/drive_can_tank.cpp:340
      stall_warning_deg: 2.0                # DEFAULT
      stall_warning_time_s: 1.0             # DEFAULT
    physical:
      scale: 1.0                            # DEFAULT
      offset_deg: 0.0                       # DEFAULT
    gazebo:
      urdf_joint: Joint_4
      urdf_sign: -1.0                       # θ4 = 2.133° − q4 (reporte §4.1)
      urdf_offset_deg: 2.133                # reporte §4.1
      limit_margin_deg: 0.0
      effort: 60.0                          # DEFAULT N·m
      velocity: 3.0                         # DEFAULT rad/s

  joint5:                                   # muñeca (roll), servo
    driver_node: arm_j5_servo
    driver_model: servo
    command_topic: /arm_teleop/joint5       # arm_controller/arm_controller/arm_manager.py:216
    log_name: J5
    servo:
      deg_min: -90.0                        # reporte D5 (GUIA_PENDIENTES.md:153)
      deg_max: 90.0                         # reporte D5
      speed_deg_s: 60.0                     # DEFAULT velocidad típica de servo (reporte D5)
      warn_on_clamp: false                  # DEFAULT: no se sabe si el controlador real avisa
    physical:
      scale: 1.0                            # DEFAULT
      offset_deg: 0.0                       # DEFAULT
    gazebo:
      urdf_joint: Joint_5
      urdf_sign: 1.0                        # DEFAULT (s5 desconocido, reporte §4.1)
      urdf_offset_deg: 0.0
      limit_margin_deg: 0.0
      effort: 30.0                          # DEFAULT N·m
      velocity: 3.0                         # DEFAULT rad/s

# Bloque del modelo `torque` (contrato de epos4_drive). Hoy no lo usa ningún joint. Para probarlo en J2:
# driver_model: torque en joints.joint2 y un bloque `torque:` como este dentro de joints.joint2.
torque_model_template:
  command_topic: /arm_teleop/joint2/torque_nm   # DEFAULT (epos4_drive usa joint3: K11, reporte §E.13)
  feedback_deg_topic: /arm_feedback/joint2_deg
  feedback_raw_topic: /arm_feedback/joint2_ticks
  loop_hz: 200.0                    # epos4_drive/config/epos4_params.yaml:10
  encoder_cpr: 500                  # epos4_drive/config/epos4_params.yaml:13
  gear_ratio: 1.0                   # epos4_drive/config/epos4_params.yaml:14 (sin calibrar, reporte §E.13)
  initial_angle: 170.0              # P2 (epos4_drive usa 180, epos4_params.yaml:15)
  sign: 1.0                         # epos4_drive/config/epos4_params.yaml:16
  max_speed_rpm: 3000.0             # epos4_drive/config/epos4_params.yaml:19
  max_torque_nm: 0.20               # epos4_drive/config/epos4_params.yaml:20
  watchdog_timeout_ms: 500.0        # epos4_drive/config/epos4_params.yaml:21
  joint_gear_ratio: 100.0           # DEFAULT par en el joint = par de motor · joint_gear_ratio
  limits_deg: [-5.0, 170.0]         # DEFAULT límites del joint en Gazebo (epos4_drive no tiene límites)

# -----------------------------------------------------------------------------------------------------
# Gripper: motor DC de 12 V en lazo abierto con controlador externo (reporte N2, D6)
# -----------------------------------------------------------------------------------------------------
gripper:
  driver_node: arm_gripper_controller
  driver_model: dc_open_loop
  command_topic: /arm_teleop/gripper        # simple_drive2/simple_drive2/drive_arm_teleop.py:32
  open_sign: 1.0                            # PENDIENTE P4 (+1 = abrir, comentario de drive_arm_teleop.py:133)
  stroke_m: 0.17                            # dato del equipo (reporte N2): apertura de 0 a 17 cm
  full_stroke_time_s: 4.0                   # PENDIENTE P4
  hold_requires_button: true                # DEFAULT: sostiene mientras se mantiene el botón (instrucción v1)
  contact_min_time_s: 0.05                  # DEFAULT contacto de los dos dedos antes de sujetar
  squeeze_margin_m: 0.003                   # DEFAULT cuánto "empuja" el dedo detenido contra el objeto
  stall_tolerance_m: 0.002                  # DEFAULT dedo detenido = se quedó atrás más que esto
  end_stop_warning_time_s: 1.0              # DEFAULT aviso de "gripper en tope" (reporte §6.6)
  fingers:                                  # marco de Link_5; la malla del CAD tiene 15.2 cm de apertura
    cad_opening_m: 0.152                    # medido en Link_5.STL por tools/fit_collision.py
    finger_a: {joint: finger_a_joint, link: finger_a, axis: [0.0, -1.0, 0.0], mesh: finger_a.stl}
    finger_b: {joint: finger_b_joint, link: finger_b, axis: [0.0, 1.0, 0.0], mesh: finger_b.stl}
    mass_kg: 0.04                           # DEFAULT
    effort_n: 80.0                          # DEFAULT fuerza máxima de cada dedo en Gazebo
    velocity_m_s: 0.2                       # DEFAULT tope de Gazebo
    mu: 1.5                                 # DEFAULT fricción de las mordazas (dedos flexibles, S13)

# -----------------------------------------------------------------------------------------------------
# Modelo de Gazebo (se genera al lanzar a partir del CAD de mi_rover_description, sin modificarlo)
# -----------------------------------------------------------------------------------------------------
model:
  name: rover_arm
  description_package: mi_rover_description
  rover_xacro: urdf/rover_completo.urdf.xacro   # de aquí salen montaje (:18) y llantas (:8-11)
  arm_urdf: urdf/brazo.urdf
  chassis_urdf: urdf/chasis.urdf
  gripper_body_mesh: gripper_body.stl           # Link_5.STL sin los dedos (tools/fit_collision.py)
  fix_to_world: true                # DEFAULT: el rover no se maneja en la sim (reporte §E.4)
  rover_xyz: [0.0, 0.0, 0.0]        # DEFAULT piso a la altura del origen del chasis (reporte S8)
  self_collide: true                # reporte D10 (2026-10-28b): brazo contra chasis, piso y objetos
  # gz_ros2_control 0.7.21 sigue la posición mandando velocidad = 0.1 · (tasa del controller_manager)
  # · error. La ganancia 0.1 está fija en esta versión (no la toma del YAML). Con 100 Hz (el valor de
  # mi_rover_description/config/controllers.yaml:3) Gazebo se atrasa ~100 ms y el EPOS emulado marca
  # falla sin choque; a 1000 Hz se atrasa ~10 ms. Ver documentacion_sim.md, "Modelo de Gazebo".
  controller_update_rate_hz: 1000   # DEFAULT
  joint_state_rate_hz: 100          # DEFAULT frecuencia de /joint_states (no hace falta 1 kHz)
  physics_step_s: 0.001             # reporte §6.7
  real_time_factor: 1.0
  collision_detector: ode           # DEFAULT detector de choques de DART
  link_mu: 0.8                      # DEFAULT fricción de los eslabones

# Colisiones simplificadas (cajas en el marco de cada link). Generadas por tools/fit_collision.py a
# partir de las mallas del CAD.  # DEFAULT
collision:
  links:
    base:
      - {xyz: [-0.0775, 0.0003, 0.0016], size: [0.0099, 0.2592, 0.0032]}
      - {xyz: [-0.0026, 0.0000, 0.0166], size: [0.1399, 0.2600, 0.0332]}
      - {xyz: [0.0750, 0.0000, 0.0016], size: [0.0149, 0.2600, 0.0032]}
    Link_1:
      - {xyz: [0.0000, -0.0111, 0.0030], size: [0.0850, 0.1073, 0.0400]}
      - {xyz: [0.0120, -0.0400, 0.0280], size: [0.0920, 0.1648, 0.0100]}
      - {xyz: [0.0056, -0.0422, 0.0630], size: [0.1167, 0.1604, 0.0600]}
      - {xyz: [-0.0004, -0.0569, 0.0980], size: [0.0948, 0.1309, 0.0100]}
      - {xyz: [0.0063, -0.0812, 0.1111], size: [0.0689, 0.0824, 0.0162]}
    Link_2:
      - {xyz: [0.0000, -0.4855, -0.0431], size: [0.0513, 0.0100, 0.0382]}
      - {xyz: [0.0046, -0.4505, -0.0268], size: [0.0891, 0.0600, 0.0957]}
      - {xyz: [-0.0000, -0.3805, -0.0381], size: [0.0532, 0.0800, 0.0482]}
      - {xyz: [0.0000, -0.2255, -0.0365], size: [0.0333, 0.2300, 0.0331]}
      - {xyz: [0.0000, -0.0347, -0.0365], size: [0.0823, 0.1516, 0.0730]}
