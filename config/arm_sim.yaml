# -----------------------------------------------------------------------------------------------------
# Joystick: ventana "Attack 3 virtual" y respaldo /joy
# -----------------------------------------------------------------------------------------------------
joystick:
  mode: auto                        # auto | uinput | topic (reporte D3: uinput; /joy directo de respaldo)
  device_name: Logitech Logitech Attack 3   # DEFAULT nombre con que Linux reporta el Attack 3 (inferencia)
  vendor_id: 0x046d                 # DEFAULT Logitech
  product_id: 0xc214                # DEFAULT Attack 3
  axis_codes: [ABS_X, ABS_Y, ABS_THROTTLE]  # PENDIENTE P1 (3 ejes: X, Y, rueda; reporte §2.1)
  axis_raw_min: 0                   # DEFAULT resolución de 8 bits (inferencia)
  axis_raw_max: 255                 # DEFAULT
  # Índice = número impreso − 1 (orden evdev/SDL, reporte §2.2)  # PENDIENTE P1
  button_codes: [BTN_TRIGGER, BTN_THUMB, BTN_THUMB2, BTN_TOP, BTN_TOP2, BTN_PINKIE, BTN_BASE, BTN_BASE2, BTN_BASE3, BTN_BASE4, BTN_BASE5]
  # Respaldo /joy: copia la semántica de joy_node con los parámetros del launch real.
  joy_topic: /joy
  joy_frame_id: joy
  joy_deadzone: 0.1                 # simple_drive2/launch/drive_arm_teleop_launch.py:24
  joy_autorepeat_rate: 20.0         # simple_drive2/launch/drive_arm_teleop_launch.py:25
  release_wait_s: 0.3               # DEFAULT al cerrar: tiempo con todo suelto antes de destruir el dispositivo
  keyboard_half_deflection: 0.5     # DEFAULT palanca a 50 % con Shift
  throttle_key_step: 0.1            # DEFAULT paso de la rueda con R / F
  status_nodes: [arm_drive_ctre, dual_epos_node, arm_manager, arm_j5_servo, arm_gripper_controller]
  status_min_level: 30              # WARN (rcl_interfaces/msg/Log)
  stick_keys: {forward: [W, Up], back: [S, Down], left: [A, Left], right: [D, Right]}
  throttle_keys: {up: R, down: F}
  # Posición física de cada botón en el Attack 3 (docs/joystick_arm/joystick_foto2.jpeg y foto3.jpeg):
  # head_* = cabeza de la palanca; base_* = base. La función sale de drive_arm_teleop.py (reporte §2.2).
  buttons:
    - {number: 1, place: trigger, key: Space, label: "Gatillo: mantener = la palanca sube/baja (Z)"}
    - {number: 2, place: head_bottom, key: "2", label: Modo cartesiano}
    - {number: 3, place: head_top, key: "3", label: Modo relativo}
    - {number: 4, place: head_left, key: "4", label: Gripper abre}
    - {number: 5, place: head_right, key: "5", label: Gripper cierra}
    - {number: 6, place: base_left_back, key: "6", label: Gira muñeca +}
    - {number: 7, place: base_left_front, key: "7", label: Gira muñeca −}
    - {number: 8, place: base_front_left, key: "8", label: (sin uso)}
    - {number: 9, place: base_front_right, key: "9", label: (sin uso)}
    - {number: 10, place: base_right_front, key: "0", label: Inclina muñeca abajo}
    - {number: 11, place: base_right_back, key: "-", label: Inclina muñeca arriba}
  axes_labels:
    stick_y: "Palanca adelante/atrás: la punta avanza/retrocede (con gatillo: sube/baja)"
    stick_x: "Palanca izquierda/derecha: la punta va a los lados"
    throttle: "Rueda: servo de cámara (nadie lo escucha)"
